name: Agent Skill CI

on:
  push:
    branches: [main]
    paths:
      - "apps/agent-skill/**"
      - ".github/workflows/agent-skill-*.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/agent-skill/**"
      - ".github/workflows/agent-skill-*.yml"

defaults:
  run:
    working-directory: apps/agent-skill

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test
